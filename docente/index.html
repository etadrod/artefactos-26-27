<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body>
<title>Acceso docente</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Source+Sans+3:wght@400;600;700&display=swap"><style>/* Layout: barra de mando superior con módulo y AEV; zona de trabajo en una columna ancha (máx. 1200px) con paneles por tarea. */
:root{
  --bg:#F2F4F7; --surface:#FFFFFF; --sunk:#E8ECF2; --ink:#142033; --muted:#556275; --line:#D3DAE4;
  --navy:#1F3A68; --navy-ink:#FFFFFF; --signal:#C9561A; --signal-soft:#FBE7DA;
  --ok:#2F7D4F; --warn:#B98A12; --ko:#B3261E; --on-l:#FFFFFF;
  --r1:#C9561A; --r2:#1F5AAA; --r3:#2F7D4F; --r4:#7A3FA0;
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Source Sans 3",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --radius:6px; --maxw:1200px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1520; --surface:#162030; --sunk:#1C283A; --ink:#E5EBF3; --muted:#9BA8BA; --line:#2B384C;
  --navy:#8EAEE6; --navy-ink:#0E1520; --signal:#F0894A; --signal-soft:#3A2416;
  --ok:#55B77D; --warn:#D9AE3A; --ko:#E5675E; --on-l:#0B0F16;
  --r1:#F0894A; --r2:#7FB0F0; --r3:#55B77D; --r4:#C08BE0; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1520; --surface:#162030; --sunk:#1C283A; --ink:#E5EBF3; --muted:#9BA8BA; --line:#2B384C;
  --navy:#8EAEE6; --navy-ink:#0E1520; --signal:#F0894A; --signal-soft:#3A2416;
  --ok:#55B77D; --warn:#D9AE3A; --ko:#E5675E; --on-l:#0B0F16;
  --r1:#F0894A; --r2:#7FB0F0; --r3:#55B77D; --r4:#C08BE0; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:1rem;line-height:1.5;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--navy)}
h1,h2,h3{font-family:var(--f-display);letter-spacing:.01em;text-wrap:balance;margin:0;line-height:1.1}
h2{font-size:1.7rem;font-weight:700} h3{font-size:1.25rem;font-weight:600}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--signal);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.eyebrow{font-family:var(--f-display);font-weight:600;text-transform:uppercase;letter-spacing:.12em;font-size:.82rem;color:var(--signal)}
.muted{color:var(--muted)} .small{font-size:.88rem}
.top{background:var(--navy);color:var(--navy-ink);position:sticky;top:env(safe-area-inset-top,0px);z-index:9}
.top-in{max-width:var(--maxw);margin:0 auto;padding-block:.65rem;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-wrap:wrap;gap:.5rem 1rem;align-items:center;justify-content:space-between}
.top b{font-family:var(--f-display);font-size:1.4rem;font-weight:700;letter-spacing:.02em;display:block;line-height:1.1}
.top span{font-size:.8rem;opacity:.85}
.chips{display:flex;gap:.35rem;flex-wrap:wrap}
.chips em{font-style:normal;font-family:var(--f-mono);font-size:.75rem;border:1px solid currentColor;border-radius:3px;padding:.05rem .45rem}
.tabs{max-width:var(--maxw);margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;gap:.2rem;overflow-x:auto}
.tabs button{background:none;border:0;color:var(--navy-ink);opacity:.75;padding:.5rem .8rem .55rem;font-family:var(--f-display);font-size:1.08rem;font-weight:600;cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
.tabs button[aria-selected="true"]{opacity:1;border-bottom-color:var(--signal)}
main{max-width:var(--maxw);margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:1.2rem 3rem;display:grid;gap:1.2rem}
main>*{min-width:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:1.1rem;display:grid;gap:.9rem;min-width:0}
.panel>*{min-width:0}
.intro{display:grid;gap:.35rem;max-width:72ch}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:.9rem}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr));gap:.7rem}
label.f{display:grid;gap:.25rem;font-weight:600;font-size:.94rem}
label.f small{font-weight:400;color:var(--muted)}
input[type=text],input[type=number],input[type=date],input[type=time],input[type=datetime-local],select,textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:.45rem .55rem}
textarea{min-height:4.5rem;resize:vertical}
.btns{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center}
.btn{border:1px solid var(--navy);background:var(--navy);color:var(--navy-ink);border-radius:4px;padding:.45rem .95rem;font-weight:600;cursor:pointer}
.btn.ghost{background:transparent;color:var(--navy)}
.btn.warn{border-color:var(--signal);background:transparent;color:var(--signal)}
.btn.sm{padding:.2rem .6rem;font-size:.86rem}
.btn:disabled{opacity:.45;cursor:not-allowed}
.spacer{flex:1}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.93rem}
th,td{text-align:left;padding:.4rem .5rem;border-bottom:1px solid var(--line);vertical-align:top}
th{font-family:var(--f-display);font-weight:600;font-size:1rem;letter-spacing:.03em}
td.num{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
th.num{text-align:right}
.pill{display:inline-block;font-size:.72rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;border-radius:999px;padding:.05rem .55rem;background:var(--sunk);color:var(--muted);white-space:nowrap}
.pill.ok{background:color-mix(in srgb,var(--ok) 18%,var(--surface));color:var(--ok)}
.pill.warn{background:color-mix(in srgb,var(--warn) 20%,var(--surface));color:var(--warn)}
.pill.ko{background:color-mix(in srgb,var(--ko) 16%,var(--surface));color:var(--ko)}
.note{border-left:4px solid var(--signal);background:var(--signal-soft);padding:.5rem .8rem;border-radius:0 4px 4px 0;font-size:.92rem}
.fb{font-size:.93rem;padding:.55rem .8rem;border-radius:4px;background:var(--sunk)}
.fb.ok{border-left:4px solid var(--ok)} .fb.ko{border-left:4px solid var(--ko)}
.seg{justify-self:start;display:inline-flex;border:1px solid var(--navy);border-radius:4px;overflow:hidden;flex-wrap:wrap}
.seg button{background:transparent;border:0;padding:.35rem .75rem;cursor:pointer;color:var(--navy);font-weight:600}
.seg button[aria-pressed="true"]{background:var(--navy);color:var(--navy-ink)}
.toast{position:fixed;left:50%;bottom:calc(1rem + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:.5rem 1rem;border-radius:4px;font-weight:600;z-index:30;max-width:calc(100vw - 32px)}
.big{font-family:var(--f-mono);font-size:1.6rem;font-weight:600;font-variant-numeric:tabular-nums}
.stat{display:grid;gap:.15rem;border:1px solid var(--line);border-radius:var(--radius);padding:.7rem .85rem;background:var(--surface)}
.stat span{font-size:.82rem;color:var(--muted)}
@media (max-width:600px){.top{position:static}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
[hidden]{display:none!important}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:1rem}.card{display:grid;gap:.35rem;background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--navy);border-radius:var(--radius);padding:1rem;color:inherit;text-decoration:none}.card:hover{border-color:var(--navy)}.card b{font:600 1.25rem var(--f-display)}.card.off{opacity:.6;border-left-color:var(--line)}.vis{display:grid;gap:.4rem;margin:0 0 1.5rem}.vis label{display:flex;gap:.6rem;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:.6rem .8rem}.vis input{width:1.3rem;height:1.3rem}.row{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center}#tok{flex:1;min-width:0;padding:.45rem;border:1px solid var(--line);border-radius:4px;background:var(--surface);color:var(--ink)}</style><header class="top"><div class="top-in"><div><b>Acceso docente</b><span>Elige qué herramientas ve el alumnado</span></div><div class="chips"><a href="../index.html" style="color:inherit">← Inicio</a></div></div></header>
<main>
<section id="login" class="intro">
 <p class="muted">Pega tu clave de GitHub (token) una sola vez. Se guarda solo en este navegador.</p>
 <div class="row"><input id="tok" type="password" autocomplete="off" placeholder="github_pat_…"><button class="btn" id="bTok">Entrar</button></div>
</section>
<section id="panel" hidden>
 <div id="lista"></div>
 <div class="row"><button class="btn" id="bPub">Publicar cambios</button><button class="btn" id="bOut" style="background:transparent;color:var(--ink);border-color:var(--line)">Salir</button></div>
</section>
<p id="msg" class="small muted" style="margin-top:1rem" aria-live="polite"></p>
</main>
<script>
const ITEMS=[["evb:AEV2.1", "EVB 1502", "AEV2.1", "Mapa de Riesgos de La Isleta"], ["evb:AEV3.1 · 5.1", "EVB 1502", "AEV3.1 · 5.1", "Taller de Análisis de Riesgos"], ["evb:AEV3.3", "EVB 1502", "AEV3.3", "Simulador 1-1-2"], ["evb:AEV4.1", "EVB 1502", "AEV4.1", "Inspección digital"], ["evb:AEV6.1", "EVB 1502", "AEV6.1", "Generador de Pliego Técnico"], ["ge6:AEV2.1", "GE6 1510", "AEV2.1", "Inventario de recursos"], ["ge6:AEV3.1", "GE6 1510", "AEV3.1", "Chequeo diario"], ["ge6:AEV4.1", "GE6 1510", "AEV4.1", "Planificador de turnos"], ["ge6:AEV5.1", "GE6 1510", "AEV5.1", "Panel de indicadores"], ["ge6:AEV6.1", "GE6 1510", "AEV6.1", "Inspección digital"], ["vib:AEV1.1", "VIB 1679", "AEV1.1", "Control de accesos"], ["vib:AEV3.1", "VIB 1679", "AEV3.1", "Simulador CRA seguridad privada"], ["vib:AEV4.1", "VIB 1679", "AEV4.1", "Ronda en el depósito"], ["vib:AEV5.1", "VIB 1679", "AEV5.1", "Hoja de ruta del transporte"], ["vib:AEV6.1", "VIB 1679", "AEV6.1", "Control documental de voladura"], ["vib:AEV9.1", "VIB 1679", "AEV9.1", "Plan de desplazamiento"], ["vib:AEV10.1", "VIB 1679", "AEV10.1", "Escenarios de escolta"]], API='https://api.github.com/repos/etadrod/artefactos-26-27/contents/visibilidad.json';
const $=id=>document.getElementById(id), msg=t=>$('msg').textContent=t;
let tok='', sha=null, vis={};
try{tok=localStorage.getItem('gh_tok')||''}catch(e){}
const H=()=>({Authorization:'Bearer '+tok,Accept:'application/vnd.github+json'});
async function cargar(){
  msg('Cargando…');
  const r=await fetch(API+'?t='+Date.now(),{headers:H()});
  if(r.status==401||r.status==403){msg('La clave no es válida o no tiene permiso de escritura en el repositorio.');return salir(false)}
  if(r.ok){const j=await r.json();sha=j.sha;vis=JSON.parse(decodeURIComponent(escape(atob(j.content.replace(/\n/g,'')))))}
  else if(r.status!=404){msg('Error al leer la configuración ('+r.status+').');return}
  $('login').hidden=true;$('panel').hidden=false;pintar();msg('');
}
function pintar(){
  let h='',mod='';
  for(const [k,m,ref,n] of ITEMS){
    if(m!=mod){if(mod)h+='</div>';h+='<h3>'+m+'</h3><div class="vis">';mod=m}
    h+='<label><input type="checkbox" data-k="'+k+'"'+(vis[k]===false?'':' checked')+'><span><b>'+ref+'</b> · '+n+'</span></label>';
  }
  $('lista').innerHTML=h+'</div>';
}
async function publicar(){
  document.querySelectorAll('#lista input').forEach(c=>vis[c.dataset.k]=c.checked);
  $('bPub').disabled=true;msg('Publicando…');
  try{
    const body={message:'Visibilidad de herramientas (panel docente)',content:btoa(unescape(encodeURIComponent(JSON.stringify(vis,null,1)))),...(sha?{sha}:{})};
    const r=await fetch(API,{method:'PUT',headers:H(),body:JSON.stringify(body)});
    if(!r.ok){msg(r.status==409?'Otra edición se cruzó: recarga la página y repite.':'No se pudo publicar ('+r.status+').');return}
    sha=(await r.json()).content.sha;
    msg('Publicado. El alumnado lo verá en 1 a 10 minutos (lo que tarde GitHub en actualizar).');
  }catch(e){msg('Sin conexión: no se ha publicado nada.')}finally{$('bPub').disabled=false}
}
function salir(borrar=true){tok='';if(borrar)try{localStorage.removeItem('gh_tok')}catch(e){};$('panel').hidden=true;$('login').hidden=false}
$('bTok').onclick=()=>{tok=$('tok').value.trim();if(!tok)return;try{localStorage.setItem('gh_tok',tok)}catch(e){};cargar()};
$('bPub').onclick=publicar;$('bOut').onclick=()=>{salir();msg('Sesión cerrada en este navegador.')};
if(tok)cargar();
</script>

</body></html>
